services:
  postgres:
    image: postgres:16
    container_name: lexflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lexflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未设置：请复制 .env.example 为 .env 并填写}
      POSTGRES_DB: ${POSTGRES_DB:-lexflow}
    ports:
      - "5432:5432"
    volumes:
      - lexflow-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  lexflow-pgdata:
