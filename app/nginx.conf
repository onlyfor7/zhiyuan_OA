# LexFlow 生产站点：静态产物 + /trpc、/files 反代到 server（arch/08 §5）。
# 与 vite dev 代理同口径，前后端同源，会话 Cookie（SameSite=Lax）天然适用。

upstream lexflow_server {
    server server:3001;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传上限与服务端 FILE_MAX_MB（默认 20MB）对齐，留 multipart 余量
    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    location /trpc/ {
        proxy_pass http://lexflow_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /files/ {
        proxy_pass http://lexflow_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 下载/预览可能为大文件，关闭代理缓冲直发
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://lexflow_server;
        proxy_http_version 1.1;
    }

    # SPA 路由回退（react-router 声明式路由，刷新/直链可用）
    location / {
        # arch/12 §14.4 安全响应头四件：与 server 侧（server/src/app.ts）逐字一致，
        # 覆盖 nginx 直出的 SPA 静态壳与 /assets（/trpc、/files 由 server 自带，不重复加）
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:" always;
        try_files $uri $uri/ /index.html;
    }
}
